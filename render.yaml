# Render Blueprint for the API (Render dashboard -> New -> Blueprint -> pick this repo).
# Set DATABASE_URL in the Render dashboard; it is not stored in the repo.
services:
  - type: web
    name: cs601-portfolio-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://g1n-sh1n.github.io,http://localhost:5173
      - key: NODE_VERSION
        value: "22"
